# Continuous integration for ferroxl.
#
# Three things are checked, and they are checked separately because they fail for different
# reasons: `checks` is fast and opinionated about style, `test` is slow and only cares
# whether the code is correct on each platform, and `parity` compares what the MCP server
# actually writes against real openpyxl. A failure in one should not hide the others.
#
# `cargo nextest` runs the tests. Note that nextest does not run doctests, so the doctests
# are a separate step -- silently skipping them would leave the README examples unverified.
#
# The `parity` job is not optional. Five bugs got past 732 unit tests, every one of them a
# case where the name matched, the test passed, and the feature did nothing -- including one
# that left a workbook no reader could open. The Rust tests cannot see that class of bug;
# these harnesses read the files back with openpyxl and can.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Formatting, lints and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-checks

      # `--locked` fails if Cargo.lock would change, which is how a dependency bump
      # arrives without an unexplained lockfile edit.
      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      # The README's Rust examples are the crate's own doctests, so a drifted example
      # fails the build. This asserts the two have not diverged.
      - name: The README examples are the doctests
        run: python tools/check_readme.py

      # `tools/parity.py` audits the public surface against openpyxl, but it needs a
      # checkout of the Python original, which is not a dependency of this project. Run it
      # locally with `python tools/parity.py path/to/openpyxl/openpyxl`.

  # The MCP server's tools, checked through the protocol against real openpyxl.
  parity:
    name: MCP tools against openpyxl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-parity

      # The harnesses speak JSON-RPC to a real server process, so there has to be one. This
      # is the only job that needs a binary rather than a library.
      - name: Build the server
        run: cargo build --locked --bin ferroxl-mcp

      # Pinned in requirements.txt, because a reference that drifts under you is a reference
      # you stopped testing against: a new openpyxl release would turn a green build red for
      # reasons that have nothing to do with this commit.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the reference
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      # What the reference actually is, printed so a failure names the version rather than
      # leaving it to be guessed at.
      - name: Record the openpyxl version
        run: python -c "import openpyxl; print('openpyxl', openpyxl.__version__)"

      # Every tool, driven over stdio, then the file it wrote reopened with openpyxl.
      - name: Every tool's output matches openpyxl
        run: python tools/mcp_parity.py

      # Every tool, called with only the arguments its schema marks required -- which is
      # exactly what a model does after reading `tools/list`.
      - name: Every tool accepts the call its schema describes
        run: python tools/mcp_required.py

      # What the happy path does not cover: a second call to a mutating tool, an empty range,
      # a mistyped coordinate, and whether the workbook still opens afterwards.
      - name: The tools survive being used twice
        run: python tools/mcp_limits.py

      # Neither openpyxl's tests nor its fixtures ship in the wheel or the sdist, so the
      # source tree is needed. Fetched as an archive at the pinned tag rather than cloned:
      # openpyxl 3.x lives on Heptapod, whose anonymous git-over-https is refused, and the
      # GitHub mirror is stuck at 1.9.0 with no 3.x tags at all. The archive extracts to a
      # directory containing openpyxl/, which is the layout these harnesses expect.
      # Pinned by tag because a moving reference turns a green build red for reasons that
      # have nothing to do with the commit under test.
      - name: Fetch openpyxl at the pinned reference
        run: |
          curl --fail --silent --show-error --location \
            --output openpyxl.tar.gz \
            https://foss.heptapod.net/openpyxl/openpyxl/-/archive/3.1.5/openpyxl-3.1.5.tar.gz
          mkdir -p ../openpyxl
          tar -xzf openpyxl.tar.gz --strip-components=1 -C ../openpyxl
          # Fail here rather than four steps later with a confusing error: the harnesses need
          # these, and an empty fixture set would make corpus.py report a clean run on
          # nothing at all.
          test -f ../openpyxl/openpyxl/tests/data/genuine/mac_date.xlsx
          echo "OPENPYXL_CHECKOUT=$GITHUB_WORKSPACE/../openpyxl" >> "$GITHUB_ENV"

      # openpyxl's own test suite, run against ferroxl as the implementation. See
      # tools/upstream/README.md for what is covered and what cannot be.
      # Against real workbooks rather than fixtures the server wrote itself, with every
      # mutation checked by reading the result back with openpyxl. This is the harness that
      # found the four bugs in 0.1.10 -- a chart or an image deleted by the next save, every
      # `&` dropped from every element's text, an inline string read back empty, a header gone
      # after one save -- none of which any of the three harnesses above could see, because all
      # three check names, or a single call, rather than the file that comes out. It needs the
      # fixtures the previous step fetched, which is why it runs after them.
      - name: Every tool against real workbooks
        run: python tools/mcp_real_files.py

      # openpyxl's own test suite, run against ferroxl as the implementation. See
      # tools/upstream/README.md for what is covered and what cannot be.
      - name: openpyxl's own tests, against ferroxl
        run: python tools/upstream/run.py "$OPENPYXL_CHECKOUT"

  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not cancel the others: the point of a matrix is to see
      # everything that is broken, not the first thing that broke.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Every platform builds the same dependency graph, so the cache is shared and the
          # first job to finish warms it for the rest.
          shared-key: ci-tests

      - name: Run the tests
        run: cargo nextest run --workspace --locked --no-fail-fast
        env:
          RUST_BACKTRACE: 1

      # nextest runs test binaries, not documentation examples.
      - name: Run the doctests
        run: cargo test --doc --workspace --locked

  msrv:
    name: Builds on the declared minimum Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read from Cargo.toml rather than repeating the number here, so the job cannot
      # quietly pass on a toolchain older than the one the manifest promises to support.
      - name: Read the minimum supported version
        id: msrv
        run: echo "version=$(grep -m1 'rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-msrv

      # `check`, not `test`: this job exists to prove the code compiles on the oldest
      # supported compiler. The test suite runs on stable above.
      - name: Check
        run: cargo check --workspace --all-targets --locked