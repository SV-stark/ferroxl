[workspace]
resolver = "2"
members = ["crates/ferroxl", "crates/ferroxl-mcp"]

[workspace.package]
version = "0.1.7"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "ferroxl: a Rust library to read/write Excel 2007 xlsx/xlsm files, a feature-parity port of openpyxl, with an MCP server for AI agents"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# The version here is the requirement `ferroxl-mcp` publishes against, not a copy of the
# crate's own version. It has to name a version that exists on crates.io, so it is bumped by
# hand -- `version.workspace` does not apply to dependencies.
ferroxl = { path = "crates/ferroxl", version = "0.1.7" }
png = "0.18"
# `encoding` provides the Decoder that quick-xml's attribute API requires; ferroxl reads
# UTF-8 XML but the type is still needed at the call site.
quick-xml = { version = "0.42", features = ["encoding"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate", "bzip2"] }

[profile.release]
lto = "thin"
codegen-units = 1